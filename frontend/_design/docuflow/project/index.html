<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- lucide vanilla UMD (icon node data) -->
  <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f1f5f9;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* Dense, dark scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; border: 2px solid #0f172a; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    * { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
    input, select, textarea { font-family: inherit; }
    /* Range slider */
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: #334155; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 999px; background: #3b82f6; cursor: pointer; border: 2px solid #1e293b; box-shadow: 0 0 0 1px #3b82f6; }
    input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 999px; background: #3b82f6; cursor: pointer; border: 2px solid #1e293b; }
    @keyframes df-spin { to { transform: rotate(360deg); } }
    .df-spin { animation: df-spin 0.9s linear infinite; }
    @keyframes df-toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .df-toast-in { animation: df-toast-in 0.18s ease-out; }
    @keyframes df-indeterminate { 0% { left: -40%; } 100% { left: 100%; } }
    .df-bar-indeterminate { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 999px; animation: df-indeterminate 1.1s ease-in-out infinite; }
    @keyframes df-fade-in { from { opacity: 0; } to { opacity: 1; } }
    .df-fade-in { animation: df-fade-in 0.15s ease-out; }
    @keyframes df-dialog-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .df-dialog-in { animation: df-dialog-in 0.16s ease-out; }
    .df-pulse-dot { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); animation: df-pulse 2s infinite; }
    @keyframes df-pulse { 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screen_inbox.jsx"></script>
  <script type="text/babel" src="screen_dashboard.jsx"></script>
  <script type="text/babel" src="screen_templates.jsx"></script>
  <script type="text/babel" src="screen_rules.jsx"></script>
  <script type="text/babel" src="screen_settings.jsx"></script>
  <script type="text/babel" src="screen_ocr.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
